services:
  - type: web
    name: parcelpilot-ai
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python -m backend.db.seed && python backend/rag/ingest.py
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
